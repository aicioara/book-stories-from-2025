from: markdown
to: pdf
pdf-engine: xelatex

metadata:
  title: "Stories from 2025"
  author: "Andrei Ioan Cioara"

variables:
  geometry: margin=1in

# List of input files in order
input-files:
  - /content/01 - Introduction/2025-10-13 - Book Acknowledgement.md
  - /content/01 - Introduction/2025-10-13 - Book Introduction.md

# Ensure each chapter starts on a new page
top-level-division: chapter

toc: true
toc-depth: 2
