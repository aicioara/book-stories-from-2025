from: markdown+gfm_auto_identifiers+hard_line_breaks+lists_without_preceding_blankline
to: pdf
pdf-engine: lualatex

metadata:
  author: "ANDREI - IOAN CIOARA"

# Fonts are discussed in
# https://chatgpt.com/share/68ed6cef-d4e0-8005-a8cd-170b36ac0f91
# Variables are defined inside the settings-format-* files
variables:
  documentclass: book
  classoption: [openany]
  fontsize: 10pt


# Ensure each chapter starts on a new page
top-level-division: chapter

toc: true
toc-depth: 1

# Allows attachments
resource-path:
  - /workspace/content
  - .
